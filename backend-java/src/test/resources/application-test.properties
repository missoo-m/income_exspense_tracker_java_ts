
# H2 для тестов (PostgreSQL режим)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT настройки
app.jwt.secret=super-long-secret-key-1234567890-ABCDEFG-super-long-secret-key
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=7200000
app.client-url=http://localhost:5173

# Отключаем Redis для тестов
spring.cache.type=simple

# Заглушки для OAuth2
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Отключаем загрузку данных при старте
app.upload.dir=./test-uploads

# Случайный порт для тестов
server.port=0

# Отключаем CSRF для тестов (важно!)
spring.security.csrf.enabled=false


spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Отключаем Flyway для тестов
spring.flyway.enabled=false